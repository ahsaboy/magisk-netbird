name: Release

on:
  push:
    tags: ['v*']
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    outputs:
      asset_name: ${{ steps.release.outputs.asset-name }}
      display_version: ${{ steps.ver.outputs.display }}
      version_code: ${{ steps.ver.outputs.version_code }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Test and build WebUI
        run: |
          npm ci --prefix ui
          npm test --prefix ui
          npm run build --prefix ui
          test -s module/webroot/index.html
          test -s module/webroot/assets/netbird.js
          test -s module/webroot/assets/netbird.css
          if grep -RniE '(^|[^[:alnum:]_])vant([^[:alnum:]_]|$)|--van-[[:alnum:]_-]+|\.van-[[:alnum:]_-]+|fonts\.googleapis\.com' module/webroot/assets/netbird.js module/webroot/assets/netbird.css; then
            echo "::error::Vant or a remote font reference remains in the WebUI bundle"
            exit 1
          fi

      - name: Resolve versions
        id: ver
        run: |
          set -euo pipefail
          NB="$(curl -fsSL -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ github.token }}" \
            https://api.github.com/repos/netbirdio/netbird/releases/latest | jq -r '.tag_name' | sed 's/^v//')"
          case "$NB" in ''|null) echo "::error::cannot resolve latest NetBird version"; exit 1 ;; esac
          TAG="${GITHUB_REF_NAME}"
          BASE="${TAG%%-(*}"
          V="${BASE#v}"
          STABLE_VERSION="${V%%-*}"
          MAJ="${STABLE_VERSION%%.*}"; R="${STABLE_VERSION#*.}"; MIN="${R%%.*}"; PAT="${R#*.}"
          case "$MAJ$MIN$PAT" in ''|*[!0-9]*) echo "::error::tag '$TAG' is not vX.Y.Z or vX.Y.Z-prerelease"; exit 1 ;; esac
          BASE="v${STABLE_VERSION}"
          VC="$(grep '^versionCode=' module/module.prop | cut -d= -f2)"
          case "$VC" in ''|*[!0-9]*) echo "::error::module/module.prop has invalid versionCode"; exit 1 ;; esac
          {
            echo "nb=$NB"
            echo "display=${BASE}-(${NB})"
            echo "version_code=$VC"
          } >> "$GITHUB_OUTPUT"
          sed -i "s|^version=.*|version=${BASE}-(${NB})|" module/module.prop
          echo "Building ${BASE} with NetBird ${NB} (versionCode ${VC})"

      - name: Download and verify official NetBird binaries
        env:
          NETBIRD_VERSION: ${{ steps.ver.outputs.nb }}
        run: |
          set -euo pipefail
          BASE="https://github.com/netbirdio/netbird/releases/download/v${NETBIRD_VERSION}"
          mkdir -p module/netbird/bin
          for ARCH in amd64 arm64 armv6; do
            FILE="netbird_${NETBIRD_VERSION}_linux_${ARCH}.tar.gz"
            curl -fL --retry 3 -o "$FILE" "$BASE/$FILE"
            curl -fL --retry 3 -o netbird_checksums.txt "$BASE/netbird_${NETBIRD_VERSION}_checksums.txt"
            WANT="$(awk -v f="$FILE" '$2 == f { print $1 }' netbird_checksums.txt)"
            GOT="$(sha256sum "$FILE" | awk '{ print $1 }')"
            if [ -z "$WANT" ] || [ "$WANT" != "$GOT" ]; then
              echo "::error::sha256 verification failed for $FILE (want=$WANT got=$GOT)"
              exit 1
            fi
            mkdir -p "extract-$ARCH"
            tar -xzf "$FILE" -C "extract-$ARCH"
            BIN="$(find "extract-$ARCH" -type f -name netbird | head -n 1)"
            if [ -z "$BIN" ]; then echo "::error::netbird binary not found in $FILE"; exit 1; fi
            case "$ARCH" in
              amd64) DEST=netbird-x86_64 ;;
              arm64) DEST=netbird-arm64 ;;
              armv6) DEST=netbird-arm ;;
            esac
            install -m 755 "$BIN" "module/netbird/bin/$DEST"
          done

      - name: Publish validated module release
        id: release
        uses: KernelSU-Modules/tools/actions/module-release@e0ac1a6193e698beac3c2fc47dec88d180efca8a
        with:
          module-dir: module
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate-release-notes: true

      - name: Report release
        env:
          ASSET_NAME: ${{ steps.release.outputs.asset-name }}
          SHA256: ${{ steps.release.outputs.sha256 }}
          RELEASE_URL: ${{ steps.release.outputs.release-url }}
        run: |
          echo "Published ${ASSET_NAME}"
          echo "sha256 ${SHA256}"
          echo "${RELEASE_URL}"

  manifests:
    if: startsWith(github.ref, 'refs/tags/')
    needs: release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Update Magisk manifests
        env:
          ASSET_NAME: ${{ needs.release.outputs.asset_name }}
          VERSION: ${{ needs.release.outputs.display_version }}
          VERSION_CODE: ${{ needs.release.outputs.version_code }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ZIP_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ASSET_NAME}"
          CHANGELOG="https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/CHANGELOG.md"
          mkdir -p module/update
          for KEY in x86_64 arm64-v8a armv7; do
            jq -n --arg v "$VERSION" --argjson vc "$VERSION_CODE" \
              --arg z "$ZIP_URL" --arg c "$CHANGELOG" \
              '{version: $v, versionCode: $vc, zipUrl: $z, changelog: $c}' \
              > "module/update/update-${KEY}.json"
          done
          jq -n --arg v "$VERSION" --argjson vc "$VERSION_CODE" \
            --arg z "$ZIP_URL" --arg c "$CHANGELOG" \
            '{version: $v, versionCode: $vc, zipUrl: $z, changelog: $c}' \
            > module/update.json
          cp module/update.json update.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json module/update.json module/update/
          if git diff --cached --quiet; then
            echo "update manifests already up to date"
          else
            git commit -m "chore: update manifests for ${TAG}"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
